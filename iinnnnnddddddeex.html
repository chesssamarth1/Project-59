<!DOCTYPE html>
<html>
<head>
  <title>Heera's Bank App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <h1 class="app-title">Heera's bank</h1>

    <div class="balance-box">
      <p class="balance-label">Available balance</p>
      <p class="balance">1000</p>
    </div>

    <div class="entry-box">
      <label class="amount-label" for="amount">Enter amount</label>
      <input type="number" class="amount" placeholder="0">
    </div>

    <div class="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class="action debit" id="debit-btn">Debit</button>
    </div>

    <p class="message"></p>
    <p class="note">Terms and conditions apply</p>

  </div>

</body>
</html>
